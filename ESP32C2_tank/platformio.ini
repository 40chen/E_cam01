; PlatformIO 配置 — ESP32C2_tank（履带车模块）
;
; ---------------------------------------------------------------------------
; ⚠️ 本机的 PlatformIO 环境是混着的，跑之前先看一眼这段
;
; 机器上装了好几套 espressif32 平台（6.5.0 / 6.9.0 / 6.12.0，外加一个
; source 装的 `espressif32@src-3b1173df...`，版本字符串 53.03.10 / IDF 5.3.2）。
; **每套平台会拉不同的 ESP-IDF，并且各自建一份 Python venv**，而它们的状态不一样：
;
;   .platformio/penv/.espidf-5.3.2   好的（Python 3.11.7）  ← 这个项目一直用的是它
;   .platformio/penv/.espidf-5.3.1   坏的，缺 pyvenv.cfg
;                                     → 用 6.9.0 平台时会炸在
;                                       `CalledProcessError ... pip list`
;
; 另外那个 source 装的平台**没法在 `platform =` 里点名**：它的版本号
; 53.03.10 不是合法的 semver（前导零），写 `espressif32@53.03.10` 会报
; `SemanticVersionError: Invalid simple block`。
;
; 所以这里**故意不锁版本**（保持原样）：让 PlatformIO 用它自己的默认选择。
; 想彻底理顺，二选一：
;   1. 删掉那个坏 venv（`.platformio/penv/.espidf-5.3.1`），让 PIO 重建；
;   2. 装一个正常的、带 esp32-c2 板定义的新版本并锁上：`pio platform install
;      espressif32@6.11.0`（6.9.0 / 6.12.0 里都没有 esp32-c2-devkitm-1）。
;      ——板定义我们已经放进项目自带的一份 `boards/` 里了，所以缺的只是平台本身。
; ---------------------------------------------------------------------------

[env:esp32-c2-devkitm-1]
platform = espressif32
board = esp32-c2-devkitm-1
framework = espidf

; C2 使用 26MHz XTAL 时，IDF 默认控制台波特率为 74880；需和 monitor 一致
monitor_speed = 74880

; 烧录速度
upload_speed = 115200

; ---- flash 大小：这块模组是 2MB，和板定义里的 4MB 不一样 ----
; 不写这两行的话，PlatformIO 会拿板定义的 4MB 去和 sdkconfig 里的 2MB 对不上，
; 每次构建都刷一条 "Flash memory size mismatch detected. Expected 4MB, found 2MB!"，
; 而且 esptool 会按 4MB 去生成镜像。
; board_upload.flash_size 覆盖的是板级属性（生成镜像和上传时用），
; board_build.flash_size 让 IDF 那边的默认值也跟着对齐。
board_upload.flash_size = 2MB
board_build.flash_size = 2MB
